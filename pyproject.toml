[project]
name = "agent-code"
version = "0.1.0"
description = "Simple SWE agent CLI"
readme = "README.md"
authors = [
    { name = "sha-huang", email = "huangsha@live.com.sg" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.11.0",
    "html2text>=2025.4.15",
    "httpx[socks]>=0.28.1",
    "pathspec>=1.1.1",
    "rich>=15.0.0",
    "typer>=0.26.8",
]

[project.scripts]
agent-code = "agent_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_code"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
